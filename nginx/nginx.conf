user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/log/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 500M;

    # Port 80: PANEL STARTOWY GENEROWANY BEZPOŚREDNIO Z KODU (Brak błędu 403)
    server {
        listen 80 default_server;
        server_name _;

        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head>
    <title>Instytut Bouar - Serwer Edukacyjny</title>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; margin: 0; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .version { color: #7f8c8d; font-size: 0.9em; margin-bottom: 40px; }
        .container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 560px; margin: 0 auto; padding: 10px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 15px; padding: 30px; width: 220px; transition: transform 0.2s; text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .card h3 { margin: 15px 0 5px 0; color: #2c3e50; }
        .card p { color: #7f8c8d; font-size: 0.85em; margin: 0; text-align: center; }
        .icon { font-size: 3em; }
    </style>
</head>
<body>
    <h1>Instytut Bouar – Panel Usług Edukacyjnych</h1>
    <div class="version">Standard Bagandou-BOUAR v1.5 (Safety First)</div>
    
    <div class="container">
        <a href="//localhost:8070" class="card" target="_blank">
            <span class="icon">📚</span>
            <h3>BIBLIOTEKA / RACHEL</h3>
            <p>Encyklopedie Wikipedia, Medycyna, podręczniki i materiały offline</p>
        </a>

        <a href="//localhost:8020" class="card" target="_blank">
            <span class="icon">🎓</span>
            <h3>MOODLE</h3>
            <p>System zarządzania nauką i kursy e-learningowe</p>
        </a>

        <a href="//localhost:8009" class="card" target="_blank">
            <span class="icon">🐦</span>
            <h3>KOLIBRI</h3>
            <p>Platforma edukacyjna i ćwiczenia interaktywne</p>
        </a>

        <a href="//localhost:3000" class="card">
            <span class="icon">📊</span>
            <h3>UMAMI</h3>
            <p>Analityka i statystyki użycia serwera</p>
        </a>
    </div>

</body>
</html>';
        }
    }

    # Port 8070: Przekierowanie do RACHEL
    server {
        listen 8070;
        server_name _;

        location / {
            proxy_pass http://rachel_bouar:80;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Port 8020: Przekierowanie do Moodle
    server {
        listen 8020;
        server_name _;

        location / {
            proxy_pass http://moodle_server:80;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Port 8009: Przekierowanie do Kolibri (Pełna produkcja dla zasobów HTML5)
    server {
        listen 8009;
        server_name _;

        location / {
            proxy_pass http://kolibri_server:8080;
            proxy_set_header Host $http_host; # <-- TO ROZWIĄŻE PROBLEM ODRZUCENIA POŁĄCZENIA
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 3000;
        server_name _;

        location / {
            proxy_pass http://umami_analytics:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
