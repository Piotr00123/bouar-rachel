# --- PORT 8020: KOLIBRI ---
server {
    listen 8020;
    server_name _;

    location / {
        proxy_pass http://kolibri_server:8080; # To jest jedyny poprawny port wewnętrzny!
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
    # --- PORT 8009: RACHEL (BIBLIOTEKA) ---
    server {
        listen 8009;
        server_name _;

        location / {
            proxy_pass http://rachel_bouar:80;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # --- PORT 3000: UMAMI ANALYTICS ---
    server {
        listen 3000;
        server_name _;

        location / {
            proxy_pass http://umami_analytics:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
