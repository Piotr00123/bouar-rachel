networks:
  bouar_network:
    driver: bridge

services:
  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
#      - "${NGINX_MOODLE_PORT:-8070}:8070"
      - "${NGINX_KOLIBRI_PORT:-8020}:8020"
      - "${NGINX_RACHEL_PORT:-8009}:8009"
      - "${NGINX_UMAMI_PORT:-3000}:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./panel-assets:/usr/share/nginx/html:ro
    networks:
      - bouar_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

