  kolibri_server:
    image: learningequality/kolibri:latest
    container_name: kolibri_server
    environment:
      - KOLIBRI_HTTP_PORT=8080
      - KOLIBRI_HOME=/home/kolibri/.kolibri
    volumes:
      - ./dane_kolibri_config:/home/kolibri/.kolibri
      - ./dane_kolibri_data:/var/kolibri_data
    networks:
      - bouar_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  rachel_bouar:
    build: .
    container_name: rachel_bouar
    volumes:
      - ./dane_rachel_config:/var/www/html
      - ./dane_rachel_modules:/var/www/html/modules
    networks:
      - bouar_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  kiwix_server:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    container_name: kiwix_server
    ports:
      - "${KIWIX_PORT:-8080}:8080"
    volumes:
      - ./dane_kiwix:/data
    entrypoint: [ "sh", "-c", "exec kiwix-serve --port 8080 --skipInvalid /data/*.zim" ]
    networks:
      - bouar_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  umami_analytics:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami_analytics
    environment:
      - DATABASE_URL=postgresql://${UMAMI_DB_USER}:${UMAMI_DB_PASSWORD}@umami_db:5432/${UMAMI_DB_NAME}
      - APP_SECRET=${UMAMI_APP_SECRET}
    networks:
      - bouar_network
    restart: unless-stopped
    depends_on:
      umami_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  umami_db:
    image: postgres:15-alpine
    container_name: umami_db
    environment:
      - POSTGRES_DB=${UMAMI_DB_NAME}
      - POSTGRES_USER=${UMAMI_DB_USER}
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - ./dane_umami_db:/var/lib/postgresql/data
    networks:
      - bouar_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
